name: Main Merge validation

on:
  push:
    branches: [main, master, develop]

jobs:
  validate-project:
    name: Install, analyze and test
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: install node on VM
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: "npm"

      # Step 3: install dependencies
      - name: install dependencies
        run: npm ci

      # Step 4: verify code formatting
      - name: Execute Eslint
        run: npm run lint

      # Step 5: run unity tests
      - name: Run unit tests
        run: npm test
