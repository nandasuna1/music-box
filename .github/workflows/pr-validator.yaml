name: Pull request validation

on:
  pull_request:
    branches: [main, master, develop]
    paths-ignore:
      - "docs/**"

jobs:
  validate-project:
    name: Install, analyze and test
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: install node on VM
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      # Step 3: install dependencies
      - name: install dependencies
        run: npm ci

      # Step 4: verify code formatting
      - name: Execute Eslint
        run: npm run lint

      - name: Debug environment
        run: |
          echo "Node:"
          node --version
          echo "npm:"
          npm --version
          echo "OS:"
          uname -a
          echo "Working directory:"
          pwd
          echo "Git:"
          git status --short
          echo "Dependencies:"
          npm ls @tanstack/react-query react react-native jest jest-expo @testing-library/react-native

      # Step 5: run unity tests
      - name: Run unit tests
        run: npm test -- --runInBand
